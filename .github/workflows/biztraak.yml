name: Biztraak Pipeline
on:
  workflow_dispatch:
  push:
    tags-ignore:
      - '*'
  pull_request:
jobs:
  pipeline_not_applicable:
    name: pipeline-not-applicable
    runs-on: ubuntu-latest
    container:
      image: alpine:3.19
    env:
      ALLOWED_BRANCH: "/^(dev)$/"
      SAST_STAGE: "test"
      SAST_DISABLED: "false"
      SAST_EXCLUDED_PATHS: "spec, test, tests, node_modules, .git, dist, build, bin, obj, packages, vendor, .nuget, .terraform"
      SAST_REPORT_PATH: "./gl-sast-report.json"
      SAST_EXCLUDED_ANALYZERS: "semgrep"
      SAST_ANALYZER_IMAGE: "registry.gitlab.com/security-products/semgrep:6"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Script 1
        run: echo "Component pipeline is not applicable for this branch; skipping child pipeline."
  preflight_validation:
    name: preflight-validation
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    env:
      ALLOWED_BRANCH: "/^(dev)$/"
      SAST_STAGE: "test"
      SAST_DISABLED: "false"
      SAST_EXCLUDED_PATHS: "spec, test, tests, node_modules, .git, dist, build, bin, obj, packages, vendor, .nuget, .terraform"
      SAST_REPORT_PATH: "./gl-sast-report.json"
      SAST_EXCLUDED_ANALYZERS: "semgrep"
      SAST_ANALYZER_IMAGE: "registry.gitlab.com/security-products/semgrep:6"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Before Script 1
        run: apk add --no-cache curl jq bash grep
      - name: Script 1
        run: |
          echo '=== Preflight Validation ==='
          FAILED=0
          echo ''
          echo '--- Build Dependency Introspection ---'

          # Check for .NET projects requiring authentication
          NUGET_CONFIG="./NuGet.config"
          if [ -f "$NUGET_CONFIG" ] || find "." -maxdepth 1 -name '*.csproj' | grep -q .; then
            echo 'Found .NET project - checking for private package feeds...'
            PRIVATE_NUGET_FEED=0
            USES_NUGET_ORG=1

            if [ -f "$NUGET_CONFIG" ] && grep -qEi 'pkgs\.dev\.azure\.com|nuget\.pkg\.github\.com|myget|artifactory|packageSources' "$NUGET_CONFIG" 2>/dev/null; then
              PRIVATE_NUGET_FEED=1
            fi

            if find "." -maxdepth 1 -name '*.csproj' -exec grep -qEi 'nuget\.pkg\.github\.com|pkgs\.dev\.azure\.com|myget|artifactory' {} + 2>/dev/null; then
              PRIVATE_NUGET_FEED=1
            fi

            if [ "$PRIVATE_NUGET_FEED" -eq 1 ]; then
              echo '  [INFO] Private NuGet feed detected'
              if [ -z "${NUGET_AUTH_TOKEN:-}" ] && [ -z "${GITHUB_TOKEN:-}" ] && [ -z "${VSS_NUGET_EXTERNAL_FEED_ENDPOINTS:-}" ]; then
                echo '  [WARN] Private NuGet feed found but no auth token detected (NUGET_AUTH_TOKEN/GITHUB_TOKEN/VSS_NUGET_EXTERNAL_FEED_ENDPOINTS)'
              else
                echo '  [OK] NuGet credentials appear configured'
              fi
            fi

            if [ -f "$NUGET_CONFIG" ] \
              && grep -qi '<clear\s*/>' "$NUGET_CONFIG" 2>/dev/null \
              && ! grep -qi 'nuget\.org' "$NUGET_CONFIG" 2>/dev/null; then
              USES_NUGET_ORG=0
            fi

            if [ "$USES_NUGET_ORG" -eq 1 ]; then
              echo '  Checking nuget.org reachability...'
              if curl -fsSL --connect-timeout 10 --max-time 20 https://api.nuget.org/v3/index.json >/dev/null 2>&1; then
                echo '  [OK] nuget.org is reachable'
              else
                echo '  [FAIL] nuget.org is not reachable from this runner; dotnet restore will likely hang and then fail with NU1301'
                FAILED=1
              fi
            else
              echo '  [WARN] nuget.org reachability check skipped because NuGet.config appears to clear default feeds and only use private sources'
            fi
          else
            echo 'No .csproj or NuGet.config found in .'
          fi

          # Check Dockerfile for credential usage patterns
          DOCKERFILE="Dockerfile"
          if [ -f "$DOCKERFILE" ]; then
            echo 'Checking Dockerfile for credential patterns...'

            # Check for nova login command
            if grep -qE 'nova\s+login|composer\s+config.*nova\.laravel\.com' "$DOCKERFILE" 2>/dev/null; then
              echo '  [INFO] Nova authentication command found in Dockerfile'
              if [ -z "${NOVA_USERNAME:-}" ] || [ -z "${NOVA_LICENSE_KEY:-}" ]; then
                if [ -z "${COMPOSER_AUTH:-}" ]; then
                  echo '  [FAIL] Dockerfile uses Nova but credentials are not configured'
                  FAILED=1
                fi
              fi
            fi

            # Check for --mount=type=secret patterns (BuildKit secrets)
            # These require the secret to be passed via --secret flag in docker build, not --build-arg
            # IMPORTANT: Variables used in secret mounts MUST be marked as 'protected' in Biztraak
            echo '  Checking for BuildKit secret mounts...'
            MOUNT_SECRETS=$(grep -oE '\-\-mount=type=secret,id=([A-Za-z0-9_]+)' "$DOCKERFILE" 2>/dev/null | sed 's/.*id=//' | sort -u || true)
            if [ -n "$MOUNT_SECRETS" ]; then
              echo '  [INFO] Dockerfile uses BuildKit secret mounts:'
              for SECRET_ID in $MOUNT_SECRETS; do
                echo "    - $SECRET_ID"
                eval "SECRET_VAL=\${$SECRET_ID:-}"
                if [ -z "$SECRET_VAL" ]; then
                  echo "  [FAIL] Secret '$SECRET_ID' is required by Dockerfile but not set"
                  FAILED=1
                else
                  # Validate JSON structure for COMPOSER_AUTH
                  if [ "$SECRET_ID" = "COMPOSER_AUTH" ]; then
                    if echo "$SECRET_VAL" | jq -e . >/dev/null 2>&1; then
                      echo "  [OK] $SECRET_ID is set and contains valid JSON"
                    else
                      echo "  [FAIL] $SECRET_ID is set but contains invalid JSON"
                      echo "         BuildKit secret mount expects valid JSON for auth.json"
                      FAILED=1
                    fi
                  else
                    echo "  [OK] $SECRET_ID is set"
                  fi
                fi
              done
              echo ''
              echo '  [NOTE] Variables used with --mount=type=secret MUST be marked as protected in Biztraak.'
              echo '         If not protected, they are passed as --build-arg (not --secret) and the build will fail.'
            fi

            # Check for ARG/ENV usage of common secrets
            for SECRET in COMPOSER_AUTH NOVA_USERNAME NOVA_LICENSE_KEY NPM_TOKEN GITHUB_TOKEN; do
              if grep -qE "(ARG|ENV)\s+$SECRET" "$DOCKERFILE" 2>/dev/null; then
                eval "VAL=\${$SECRET:-}"
                if [ -z "$VAL" ]; then
                  echo "  [WARN] Dockerfile references $SECRET but it is not set"
                else
                  echo "  [OK] $SECRET is set (used in Dockerfile)"
                fi
              fi
            done
          fi
          echo ''
          echo '--- Database Connectivity Check ---'
          echo '  [SKIP] No database dependency detected in component dependencies.'
          echo ''
          echo '=== Preflight Summary ==='
          if [ $FAILED -eq 1 ]; then echo '[FAILED] One or more preflight checks failed. Fix the issues above before proceeding.'; exit 1; fi
          echo '[PASSED] All preflight checks passed.'
  biztraak_sast:
    name: biztraak-sast
    runs-on: ubuntu-latest
    needs:
      - pipeline_not_applicable
      - preflight_validation
    container:
      image: $SAST_ANALYZER_IMAGE
    env:
      ALLOWED_BRANCH: "/^(dev)$/"
      SAST_STAGE: "test"
      SAST_DISABLED: "false"
      SAST_EXCLUDED_PATHS: "spec, test, tests, node_modules, .git, dist, build, bin, obj, packages, vendor, .nuget, .terraform"
      SAST_REPORT_PATH: "./gl-sast-report.json"
      SAST_EXCLUDED_ANALYZERS: "semgrep"
      SAST_ANALYZER_IMAGE: "registry.gitlab.com/security-products/semgrep:6"
      SECURE_LOG_LEVEL: "debug"
      SEARCH_MAX_DEPTH: 20
      SEMGREP_EXTENSIONS: ".js,.ts,.jsx,.tsx,.py,.java,.cs,.go,.rb,.php,.yaml,.yml,.json"
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Script 1
        run: semgrep --config=auto --json --output "${SAST_REPORT_PATH:-gl-sast-report.json}" || true
      - name: Ensure SAST report exists
        run: |
          if [ ! -f "${SAST_REPORT_PATH:-gl-sast-report.json}" ]; then
            echo '{}' > "${SAST_REPORT_PATH:-gl-sast-report.json}"
          fi
      - name: Upload SAST report
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: ${{ env.SAST_REPORT_PATH }}
          retention-days: 1
  security_publish_sast:
    name: security_publish_sast
    runs-on: ubuntu-latest
    needs:
      - biztraak_sast
    container:
      image: alpine:3.19
    env:
      ALLOWED_BRANCH: "/^(dev)$/"
      SAST_STAGE: "test"
      SAST_DISABLED: "false"
      SAST_EXCLUDED_PATHS: "spec, test, tests, node_modules, .git, dist, build, bin, obj, packages, vendor, .nuget, .terraform"
      SAST_REPORT_PATH: "./gl-sast-report.json"
      SAST_EXCLUDED_ANALYZERS: "semgrep"
      SAST_ANALYZER_IMAGE: "registry.gitlab.com/security-products/semgrep:6"
      BIZTRAAK_PIPELINE_SECRET: ${{ secrets.BIZTRAAK_PIPELINE_SECRET }}
      BIZTRAAK_API_URL: ${{ vars.BIZTRAAK_API_URL }}
      BIZTRAAK_API_PATH: ${{ vars.BIZTRAAK_API_PATH }}
      BIZTRAAK_ENVIRONMENT: ${{ vars.BIZTRAAK_ENVIRONMENT }}
      BIZTRAAK_ACTOR_ID: ${{ vars.BIZTRAAK_ACTOR_ID }}
      BIZTRAAK_ARTIFACT_URL: ${{ vars.BIZTRAAK_ARTIFACT_URL }}
      BIZTRAAK_TEAM_ID: ${{ vars.BIZTRAAK_TEAM_ID }}
      BIZTRAAK_PROJECT_ID: ${{ vars.BIZTRAAK_PROJECT_ID }}
      BIZTRAAK_PROJECT_COMPONENT_ID: ${{ vars.BIZTRAAK_PROJECT_COMPONENT_ID }}
      BIZTRAAK_COMPONENT_DEFINITION_ID: ${{ vars.BIZTRAAK_COMPONENT_DEFINITION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download SAST report
        uses: actions/download-artifact@v4
        with:
          name: sast-report
          path: .
      - name: Before Script 1
        run: apk add --no-cache curl bash jq openssl
      - name: Script 1
        run: |
          if [ ! -f "$SAST_REPORT_PATH" ]; then
            echo "No SAST report at $SAST_REPORT_PATH; skipping publish."
            exit 0
          fi
      - name: Script 2
        run: |
          if [ -z "$BIZTRAAK_API_URL" ]; then
            echo "ERROR: BIZTRAAK_API_URL is not set. Cannot publish security scan results."
            exit 1
          fi
      - name: Script 3
        run: |
          CRITICAL=$(jq -r '[.vulnerabilities[]? | select(.severity == "critical")] | length' "$SAST_REPORT_PATH" 2>/dev/null || echo "0")
          HIGH=$(jq -r '[.vulnerabilities[]? | select(.severity == "high")] | length' "$SAST_REPORT_PATH" 2>/dev/null || echo "0")
          MEDIUM=$(jq -r '[.vulnerabilities[]? | select(.severity == "medium")] | length' "$SAST_REPORT_PATH" 2>/dev/null || echo "0")
          LOW=$(jq -r '[.vulnerabilities[]? | select(.severity == "low")] | length' "$SAST_REPORT_PATH" 2>/dev/null || echo "0")
          INFO=$(jq -r '[.vulnerabilities[]? | select(.severity == "info")] | length' "$SAST_REPORT_PATH" 2>/dev/null || echo "0")
          UNKNOWN=$(jq -r '[.vulnerabilities[]? | select(.severity == "unknown" or .severity == null)] | length' "$SAST_REPORT_PATH" 2>/dev/null || echo "0")

          SECRET_B64="${BIZTRAAK_PIPELINE_SECRET}"
          SECRET_HEX=$(echo -n "$SECRET_B64" | base64 -d | od -A n -t x1 | tr -d ' \n\t')
          TIMESTAMP=$(date -u +%s)
          NONCE=$(openssl rand -hex 16)

          PAYLOAD=$(jq -c -S -n \
            --arg teamId "$BIZTRAAK_TEAM_ID" \
            --arg projectId "$BIZTRAAK_PROJECT_ID" \
            --arg projectComponentId "$BIZTRAAK_PROJECT_COMPONENT_ID" \
            --arg componentId "$BIZTRAAK_COMPONENT_DEFINITION_ID" \
            --arg branch "$CI_COMMIT_REF_NAME" \
            --arg commitSha "$CI_COMMIT_SHA" \
            --arg scanner "semgrep" \
            --arg version "6" \
            --arg artifactUrl "$BIZTRAAK_ARTIFACT_URL" \
            --arg reportPath "$SAST_REPORT_PATH" \
            --arg jobUrl "$CI_JOB_URL" \
            --arg jobName "$CI_JOB_NAME" \
            --arg pipelineId "$CI_PIPELINE_ID" \
            --arg environment "$BIZTRAAK_ENVIRONMENT" \
            --arg source "gitlab" \
            --argjson critical "$CRITICAL" \
            --argjson high "$HIGH" \
            --argjson medium "$MEDIUM" \
            --argjson low "$LOW" \
            --argjson info "$INFO" \
            --argjson unknown "$UNKNOWN" \
            '{
              teamId: $teamId,
              projectId: $projectId,
              projectComponentId: $projectComponentId,
              componentId: $componentId,
              branch: $branch,
              commitSha: $commitSha,
              scanner: $scanner,
              version: $version,
              artifactUrl: $artifactUrl,
              reportPath: $reportPath,
              jobUrl: $jobUrl,
              jobName: $jobName,
              pipelineId: $pipelineId,
              environment: $environment,
              source: $source,
              counts: {
                critical: $critical,
                high: $high,
                medium: $medium,
                low: $low,
                info: $info,
                unknown: $unknown
              }
            }')

          SIGNATURE=$(printf '%s.%s.%s' "$TIMESTAMP" "$NONCE" "$PAYLOAD" | openssl dgst -sha256 -mac HMAC -macopt "hexkey:$SECRET_HEX" | sed 's/^.* //' | tr -d '\n')

          BASE_URL=$(echo "$BIZTRAAK_API_URL" | sed 's|/$||')
          API_PATH="${BIZTRAAK_API_PATH:-/api/security-scan/results}"
          API_PATH=$(echo "$API_PATH" | sed 's|^/|/|')
          API_URL="${BASE_URL}${API_PATH}"

          RESPONSE=$(curl -v -s -w "\n%{http_code}" -X POST "$API_URL" \
            -H "Content-Type: application/json" \
            -H "X-Biztraak-Timestamp: $TIMESTAMP" \
            -H "X-Biztraak-Nonce: $NONCE" \
            -H "X-Biztraak-Signature: $SIGNATURE" \
            -d "$PAYLOAD" 2>&1)

          HTTP_CODE=$(echo "$RESPONSE" | grep -E '^[0-9]{3}$' | tail -n1)
          BODY=$(echo "$RESPONSE" | grep -v -E '^[0-9]{3}$' | grep -v -E '^[<>*]' | tail -n +2)

          if [ -z "$HTTP_CODE" ]; then
            echo "ERROR: Failed to parse HTTP response"
            echo "Full response: $RESPONSE"
            exit 1
          fi

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Security scan results published successfully (HTTP $HTTP_CODE)"
          else
            echo "Failed to publish security scan results (HTTP $HTTP_CODE)"
            echo "Response body: $BODY"
            echo "API URL: $API_URL"
            echo "Payload size: $(echo -n "$PAYLOAD" | wc -c) bytes"
            echo "Full curl response (first 500 chars):"
            echo "$RESPONSE" | head -c 500
            exit 1
          fi
  compliance_security_gate:
    name: compliance-security-gate
    runs-on: ubuntu-latest
    needs:
      - security_publish_sast
    env:
      ALLOWED_BRANCH: "/^(dev)$/"
      SAST_STAGE: "test"
      SAST_DISABLED: "false"
      SAST_EXCLUDED_PATHS: "spec, test, tests, node_modules, .git, dist, build, bin, obj, packages, vendor, .nuget, .terraform"
      SAST_REPORT_PATH: "./gl-sast-report.json"
      SAST_EXCLUDED_ANALYZERS: "semgrep"
      SAST_ANALYZER_IMAGE: "registry.gitlab.com/security-products/semgrep:6"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Script 1
        run: echo "Security scan published to Biztraak; compliance gate satisfied."
  build:
    name: build
    runs-on: ubuntu-latest
    needs:
      - compliance_security_gate
    container:
      image: docker:27.0.3
    env:
      ALLOWED_BRANCH: "/^(dev)$/"
      SAST_STAGE: "test"
      SAST_DISABLED: "false"
      SAST_EXCLUDED_PATHS: "spec, test, tests, node_modules, .git, dist, build, bin, obj, packages, vendor, .nuget, .terraform"
      SAST_REPORT_PATH: "./gl-sast-report.json"
      SAST_EXCLUDED_ANALYZERS: "semgrep"
      SAST_ANALYZER_IMAGE: "registry.gitlab.com/security-products/semgrep:6"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Before Script 1
        run: apk add --no-cache curl bash
      - name: Script 1
        run: |
          # Detect BuildKit secret mounts in Dockerfile and prepare them
          DOCKERFILE="Dockerfile"
          SECRET_ARGS=""
          if [ -f "$DOCKERFILE" ]; then
            MOUNT_SECRETS=$(grep -oE '\-\-mount=type=secret,id=([A-Za-z0-9_]+)' "$DOCKERFILE" 2>/dev/null | sed 's/.*id=//' | sort -u || true)
            for SECRET_ID in $MOUNT_SECRETS; do
              eval "SECRET_VAL=\${$SECRET_ID:-}"
              if [ -n "$SECRET_VAL" ]; then
                # Write secret to temp file for BuildKit
                TEMP_FILE="/tmp/secret_${SECRET_ID}"
                printf '%s' "$SECRET_VAL" > "$TEMP_FILE"
                SECRET_ARGS="$SECRET_ARGS --secret id=$SECRET_ID,src=$TEMP_FILE"
                echo "[build] Prepared secret mount: $SECRET_ID"
              fi
            done
          fi
          # Run docker build with detected secrets
          export DOCKER_BUILDKIT=1
          docker build -f "$DOCKERFILE" $SECRET_ARGS -t "local-build:$CI_COMMIT_SHORT_SHA" .
          # Cleanup secret temp files
          if [ -f "$DOCKERFILE" ]; then
            for SECRET_ID in $MOUNT_SECRETS; do
              TEMP_FILE="/tmp/secret_${SECRET_ID}"
              [ -f "$TEMP_FILE" ] && rm -f "$TEMP_FILE"
            done
          fi
      - name: Script 2
        run: echo "$CI_JOB_TOKEN" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      - name: Script 3
        run: docker tag "local-build:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      - name: Script 4
        run: docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
